# ======================================================================
#  Reglages propres a ce deploiement (IRC derriere un hidden service Tor)
#
#  Ce fichier est inclus automatiquement : /inspircd/conf/config.sh emet
#  un <include> pour chaque fichier conf.d/*.conf. Il est lu AVANT
#  inspircd.conf et modules.conf, donc ses valeurs ont la priorite.
# ======================================================================

# --- Clients arrivant par le hidden service ---------------------------
#
#  Toutes les connexions Tor sortent de l'UNIQUE adresse IP du conteneur
#  "tor". Or la classe par defaut de l'image limite a 3 connexions par IP
#  (localmax="3" globalmax="3" avec <cidr ipv4clone="32">) : sans les
#  classes ci-dessous, le serveur plafonne a 3 utilisateurs AU TOTAL et
#  le 4e est ejecte avec "No more local connections allowed from your
#  host via this connect class.".
#
#  On couvre les trois plages privees que Docker peut attribuer a son
#  reseau bridge, pour que le correctif tienne quel que soit le subnet
#  choisi par Docker. Aucune exposition : le port 6667 n'est publie sur
#  aucune interface de l'hote, ces plages ne sont joignables que depuis
#  les conteneurs du projet.
#
#  parent="main" fait heriter le mot de passe de connexion (&connectpassword;),
#  les timeouts et les limites de flood de la classe par defaut.
#  resolvehostnames="no" supprime le reverse DNS, inutile et lent sur une
#  IP de conteneur ("Could not resolve your hostname: Malformed answer").

<connect name="docker-172"
         parent="main"
         allow="172.16.0.0/12"
         localmax="200"
         globalmax="200"
         limit="200"
         resolvehostnames="no"
         useident="no">

<connect name="docker-10"
         parent="main"
         allow="10.0.0.0/8"
         localmax="200"
         globalmax="200"
         limit="200"
         resolvehostnames="no"
         useident="no">

<connect name="docker-192"
         parent="main"
         allow="192.168.0.0/16"
         localmax="200"
         globalmax="200"
         limit="200"
         resolvehostnames="no"
         useident="no">

# --- Anti-flood de connexion ------------------------------------------
#
#  Le module connectban est charge par defaut par l'image, sans bloc de
#  configuration : seuil de 10 connexions par heure et Z-line de 6 heures,
#  comptees PAR IP. Avec Tor, tout le monde partageant une seule IP, le
#  10e client bannirait l'ensemble des utilisateurs pour 6 h - et le ban
#  est persiste sur disque (/inspircd/data/xline.db).
#
#  NB : threshold="0" est REFUSE par InspIRCd 4 ("not between 2 and ...").

<connectban threshold="100"
            banduration="5m"
            ipv4cidr="32"
            ipv6cidr="128"
            bootwait="2m">

# Exemptions de [KGZ]-lines : la sonde healthcheck (loopback) et les
# conteneurs du projet ne doivent jamais pouvoir se faire bannir.
<exception host="*@127.0.0.1"      reason="sonde healthcheck locale">
<exception host="*@172.16.0.0/12"  reason="reseau Docker (tor, webclient)">
<exception host="*@10.0.0.0/8"     reason="reseau Docker (tor, webclient)">
<exception host="*@192.168.0.0/16" reason="reseau Docker (tor, webclient)">
