<server name="IRC_SERVER_NAME_VAR"
        description="IRC_DESCRIPTION_VAR"
        network="IRC_NETWORK_NAME_VAR">

<admin name="admin" email="ADMIN_EMAIL_VAR" nick="Admin">
<encoding server="utf-8" client="utf-8">

<bind address="*" port="6667" type="clients">

<files motd="/etc/inspircd/motd.txt">

<connect allow="*" timeout="30" flood="10" threshold="5" limit="MAX_USERS_VAR">
<channels users="20">

<module name="permchannels">
<permchanneldb filename="/etc/inspircd/permchannels.conf" listmodes="yes">

<module name="sha256">
<module name="password_hash">

<oper name="admin"
      password="OPER_PASSWORD_HASH_VAR"
      hash="sha256"
      class="ServerOperators"
      host="*@*"
      type="NetAdmin">

<type name="NetAdmin"
      classes="OperChat HostCloak BanControl AccessControl ULineCommands"
      vhost="net.admin"
      maxchans="50">

<class name="OperChat"
       commands="WALLOPS GLOBOPS">

<class name="BanControl"
       commands="KILL GLINE KLINE ZLINE QLINE ELINE TLINE RLINE CHECK NICKLOCK SHUN CLONES CBAN">

<class name="AccessControl"
       commands="REHASH RESTART DIE LOADMODULE UNLOADMODULE RELOADMODULE SAJOIN SAPART SANICK SAQUIT SATOPIC">

<class name="ULineCommands"
       commands="SQUIT CONNECT MKPASSWD ALLTIME SWHOIS CLOSE JUMPSERVER LOCKSERV">

<class name="HostCloak"
       commands="SETHOST SETIDENT SETNAME CHGHOST CHGIDENT">

<options allowzerolimit="no"
         casemapping="ascii"
         cyclehostsfromuser="no"
         defaultbind="auto"
         defaultmodes="nt"
         exemptchanops=""
         fixedpart=""
         fixedquit=""
         hostintopic="yes"
         invitebypassmodes="yes"
         nosnoticestack="no"
         modesinlist="no"
         prefixpart="&quot;"
         prefixquit="Quit: "
         splitwhois="no"
         suffixpart="&quot;"
         suffixquit=""
         syntaxhints="yes"
         xlinemessage="You are banned. Contact the admin to appeal.">

<log method="file" type="* -USERINPUT -USEROUTPUT" level="default" target="/var/log/inspircd/inspircd.log">
<pid file="/var/run/inspircd/inspircd.pid">
