services:
  irc:
    build:
      context: ./images/irc
    image: irc-server
    container_name: irc-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    environment:
      INSP_NET_NAME: ${IRC_NETWORK_NAME:-LocalNet}
      INSP_NET_SUFFIX: ${IRC_NET_SUFFIX:-.irc.local}
      INSP_ADMIN_NAME: ${ADMIN_NAME:-admin}
      INSP_ADMIN_NICK: ${ADMIN_NICK:-Admin}
      INSP_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      INSP_OPER_NAME: admin
      INSP_OPER_PASSWORD_HASH: ${OPER_PASSWORD_HASH:-CHANGEME}
      INSP_OPER_HASH: hmac-sha256
      INSP_OPER_SSLONLY: "no"
      INSP_ENABLE_DNSBL: "no"
      INSP_CONNECT_PASSWORD: ${CONNECT_PASSWORD:-}
      INSP_CONNECT_HASH: ""
      DEFAULT_CHANNEL: ${DEFAULT_CHANNEL:-#general}
      DEFAULT_TOPIC: ${DEFAULT_TOPIC:-Bienvenue !}
    volumes:
      - irc_conf:/inspircd/conf
      - irc_logs:/inspircd/logs
    networks:
      - irc_net
    healthcheck:
      test: ["CMD", "/usr/bin/nc", "127.0.0.1", "6667"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  tor:
    build:
      context: ./images/tor
    image: tor-hidden-service
    container_name: tor-hidden-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    volumes:
      - tor_keys:/var/lib/tor/hidden_service
    networks:
      - irc_net
    depends_on:
      irc:
        condition: service_healthy

  proxytor:
    image: dperson/torproxy
    container_name: tor-proxy
    restart: unless-stopped
    ports:
      - "8118:8118"
      - "9050:9050"

  webclient:
    image: ghcr.io/thelounge/thelounge:latest
    container_name: irc-webclient
    restart: unless-stopped
    ports:
      - "${WEBCLIENT_PORT:-8080}:9000"
    volumes:
      - thelounge_data:/var/opt/thelounge
    networks:
      - irc_net
    depends_on:
      irc:
        condition: service_healthy

volumes:
  irc_conf:
  irc_logs:
  tor_keys:
  thelounge_data:

networks:
  irc_net:
    driver: bridge
